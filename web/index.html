<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131311">
<title>Eunoia</title>
<script>
  // Resolve the theme before the first paint. The stylesheet only has two
  // states, so an explicit choice has to be written onto <html> rather than
  // left to a media query that cannot be overridden by the toggle.
  (function () {
    try {
      var stored = localStorage.getItem('df_theme');
      var system = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme =
        stored === 'dark' || stored === 'light' ? stored : (system ? 'dark' : 'light');
    } catch (error) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<style>
  /* --------------------------------------------------------------- tokens --
     Warm paper, sage ink, one accent. The workspace is meant to recede so the
     conversation stays the brightest thing on screen. */
  :root {
    color-scheme: light;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC",
                    "Noto Serif SC", Georgia, serif;

    --canvas: #f5f3ee;
    --canvas-glow: #fdfcf8;
    --sidebar: #faf9f5;
    --surface: #fffefb;
    --surface-2: #f1eee7;
    --surface-3: #e9e5db;
    --line: #e5e0d5;
    --line-strong: #d3ccbd;
    --ink: #24211c;
    --ink-2: #565149;
    --muted: #6f6a5f;
    --faint: #786f63;
    --accent: #4e6a56;
    --accent-strong: #3d5644;
    --accent-soft: #e7efe7;
    --accent-softer: #f1f5f0;
    --accent-ink: #34503d;
    --on-accent: #f7faf6;
    --user-bubble: #e8eee7;
    --user-border: #dbe4d9;
    --danger: #a24e3b;
    --danger-soft: #fbefeb;
    --danger-border: #eed5cc;
    --on-danger: #fff;
    --warn-bg: #fbf4e8;
    --warn-border: #ecdcbc;
    --warn-ink: #6f5527;
    --think: #7f663b;
    --think-bg: #f6f1e7;
    --think-border: #e7ddc9;
    --dot: rgba(80, 74, 63, .075);

    --shadow-xs: 0 1px 2px rgba(36, 33, 28, .04);
    --shadow-sm: 0 2px 8px -2px rgba(36, 33, 28, .08), 0 1px 2px rgba(36, 33, 28, .04);
    --shadow-md: 0 12px 34px -14px rgba(36, 33, 28, .18), 0 2px 8px -2px rgba(36, 33, 28, .06);
    --shadow-lg: 0 30px 80px -30px rgba(28, 25, 20, .35);

    --radius-sm: 9px;
    --radius: 14px;
    --radius-lg: 20px;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #131311;
    --canvas-glow: #1b1b18;
    --sidebar: #181816;
    --surface: #201f1c;
    --surface-2: #282722;
    --surface-3: #302f29;
    --line: #302f2a;
    --line-strong: #3d3b34;
    --ink: #ebe7df;
    --ink-2: #bcb6ab;
    --muted: #a39c8f;
    --faint: #948d81;
    --accent: #9dbaa4;
    --accent-strong: #b6d0bc;
    --accent-soft: #243028;
    --accent-softer: #1f2a23;
    --accent-ink: #c6dccb;
    --on-accent: #152017;
    --user-bubble: #243028;
    --user-border: #314137;
    --danger: #d3846d;
    --danger-soft: #2f211d;
    --danger-border: #4a3029;
    --on-danger: #2a1510;
    --warn-bg: #2d261b;
    --warn-border: #4a3d27;
    --warn-ink: #d9c18b;
    --think: #c6a86d;
    --think-bg: #28241c;
    --think-border: #3e3729;
    --dot: rgba(255, 255, 255, .035);

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, .2);
    --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, .35), 0 1px 2px rgba(0, 0, 0, .2);
    --shadow-md: 0 12px 34px -14px rgba(0, 0, 0, .55), 0 2px 8px -2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 30px 80px -30px rgba(0, 0, 0, .7);
  }

  /* ----------------------------------------------------------------- base -- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, p { margin: 0; }
  button, input, textarea { font: inherit; }
  button { color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }

  .icon {
    width: 18px; height: 18px; display: block; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .app { display: flex; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }

  /* -------------------------------------------------------------- sidebar -- */
  .sidebar {
    position: relative; z-index: 30;
    flex: 0 0 292px; width: 292px;
    display: flex; flex-direction: column; min-height: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
  }

  .sidebar-head {
    display: flex; align-items: center; gap: 10px;
    padding: calc(20px + env(safe-area-inset-top)) 18px 16px;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
  .brand-mark {
    width: 37px; height: 37px; border-radius: 12px; flex: 0 0 auto;
    display: grid; place-items: center; color: var(--on-accent);
    background: linear-gradient(145deg, var(--accent) 0%, var(--accent-strong) 100%);
    box-shadow: 0 7px 18px -8px rgba(61, 86, 68, .65),
                inset 0 1px 0 rgba(255, 255, 255, .2);
  }
  .brand-mark .icon { width: 21px; height: 21px; stroke-width: 1.6; }
  .brand-copy { min-width: 0; }
  .brand-copy h1 {
    font-family: var(--font-display); font-size: 21px; font-weight: 600;
    line-height: 1.1; letter-spacing: -.015em;
  }
  .brand-copy span {
    display: block; margin-top: 3px;
    font-size: 10px; font-weight: 500; letter-spacing: .16em;
    color: var(--muted); text-transform: uppercase;
  }

  .new-chat {
    display: flex; align-items: center; gap: 10px;
    margin: 2px 14px 20px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow-xs);
    font-size: 13.5px; font-weight: 500; text-align: left;
    transition: border-color .16s ease, background .16s ease, transform .16s ease;
  }
  .new-chat:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .new-chat:active { transform: translateY(1px); }
  .new-chat-icon {
    width: 27px; height: 27px; border-radius: 8px;
    display: grid; place-items: center; flex: 0 0 auto;
    color: var(--accent-strong); background: var(--accent-soft);
  }
  .new-chat-icon .icon { width: 15px; height: 15px; stroke-width: 2; }
  .new-chat::after {
    content: ""; width: 5px; height: 5px; margin-left: auto;
    border-right: 1.4px solid var(--faint); border-top: 1.4px solid var(--faint);
    transform: rotate(45deg);
  }

  .sidebar-section { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 10px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 0 8px 8px;
  }
  .section-label {
    font-size: 10px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
  }
  .history-tools button {
    padding: 3px 7px; border-radius: 999px;
    font-size: 10.5px; color: var(--muted);
    transition: color .16s ease, background .16s ease;
  }
  .history-tools button:hover { color: var(--ink-2); background: var(--surface-2); }
  .history-tools button[aria-pressed="true"] { color: var(--accent-strong); background: var(--accent-soft); }

  .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 0 14px; }
  .history-note {
    color: var(--danger); font-size: 11.5px; line-height: 1.5;
    padding: 0 9px 6px;
  }
  .history-note:empty { display: none; }
  .thread-list { display: flex; flex-direction: column; gap: 2px; }

  .thread-row {
    position: relative; display: flex; align-items: stretch;
    border-radius: 12px;
    transition: background .16s ease, box-shadow .16s ease;
  }
  /* The selected tint belongs to the whole row so the lifecycle actions sit
     inside the same surface instead of floating beside the highlight. */
  .thread-row.active {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--user-border);
  }
  .thread {
    flex: 1; min-width: 0;
    display: grid; grid-template-columns: 16px minmax(0, 1fr);
    grid-template-rows: auto auto; align-items: center;
    column-gap: 8px; padding: 9px 38px 9px 10px;
    border: 1px solid transparent; border-radius: 12px;
    text-align: left; transition: background .16s ease, border-color .16s ease;
  }
  .thread:hover { background: var(--surface-2); }
  .thread[aria-current="true"] { background: transparent; border-color: transparent; }
  .thread-row.active .thread:hover { background: transparent; }
  .thread-mark {
    grid-row: 1 / span 2; justify-self: center;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--line-strong); transition: background .16s ease, box-shadow .16s ease;
  }
  .thread[aria-current="true"] .thread-mark {
    background: var(--accent); box-shadow: 0 0 0 3px var(--accent-softer);
  }
  .thread .name {
    grid-column: 2; min-width: 0;
    font-size: 13px; font-weight: 500; line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thread .name.unnamed { color: var(--muted); font-weight: 400; }
  .thread .when {
    grid-column: 2; margin-top: 1px;
    font-size: 10.5px; line-height: 1.4; color: var(--muted);
  }
  .thread[aria-current="true"] .name { color: var(--accent-ink); }

  .thread-actions {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 0;
    padding: 2px; border-radius: 8px;
    background: var(--surface); box-shadow: var(--shadow-xs);
    opacity: 0; pointer-events: none;
    transition: opacity .15s ease;
  }
  .thread-row:hover .thread-actions,
  .thread-row:focus-within .thread-actions { opacity: 1; pointer-events: auto; }
  .thread-row.active .thread-actions { background: var(--accent-soft); box-shadow: none; }
  .thread-actions button {
    padding: 1px 5px; border-radius: 5px;
    font-size: 10.5px; line-height: 1.45; color: var(--muted);
    transition: color .14s ease, background .14s ease;
  }
  .thread-actions button:hover { color: var(--accent-strong); background: var(--accent-softer); }
  .thread-actions button.thread-delete:hover { color: var(--danger); background: var(--danger-soft); }
  .thread-actions button[data-armed="true"] { color: var(--on-danger); background: var(--danger); }
  .thread-actions button[data-armed="true"]:hover { color: var(--on-danger); }

  .thread-rename {
    display: flex; flex: 1; align-items: center; gap: 4px;
    padding: 5px 4px;
  }
  .thread-rename input {
    flex: 1; min-width: 0; padding: 6px 8px;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); color: var(--ink);
    font-size: 12.5px;
  }
  .thread-rename input:focus { outline: none; border-color: var(--accent); }
  .thread-rename button {
    padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--line); font-size: 11.5px;
  }
  .thread-rename button.primary { border-color: var(--accent); }

  .sidebar-foot {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
    padding: 12px 14px calc(15px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: linear-gradient(to top, var(--sidebar) 72%, transparent);
  }
  .memory-entry {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); text-align: left;
    transition: border-color .16s ease, box-shadow .16s ease;
  }
  .memory-entry:hover { border-color: var(--line-strong); box-shadow: var(--shadow-xs); }
  .memory-entry-icon {
    width: 31px; height: 31px; flex: 0 0 auto; border-radius: 9px;
    display: grid; place-items: center;
    color: var(--accent-strong); background: var(--accent-soft);
  }
  .memory-entry-icon .icon { width: 16px; height: 16px; }
  .memory-entry-copy { flex: 1; min-width: 0; }
  .memory-entry-copy strong { display: block; font-size: 12.5px; font-weight: 550; line-height: 1.4; }
  .memory-entry-copy span { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.4; }
  .memory-entry > .icon { width: 14px; height: 14px; color: var(--faint); }

  .sidebar-tools { display: flex; gap: 4px; }
  .tool-button {
    flex: 1; display: flex; align-items: center; gap: 7px;
    padding: 7px 9px; border-radius: 8px;
    font-size: 11px; color: var(--muted);
    transition: color .16s ease, background .16s ease;
  }
  .tool-button:hover { color: var(--ink-2); background: var(--surface-2); }
  .tool-button .icon { width: 14px; height: 14px; }
  .theme-icon-sun { display: none; }
  :root[data-theme="dark"] .theme-icon-sun { display: block; }
  :root[data-theme="dark"] .theme-icon-moon { display: none; }
  .sidebar-note {
    display: flex; align-items: center; gap: 6px;
    margin: 1px 4px 0; font-size: 10px; color: var(--faint);
  }
  .sidebar-note .icon { width: 12px; height: 12px; }

  .sidebar-scrim {
    position: fixed; inset: 0; z-index: 25;
    background: rgba(24, 21, 17, .42);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }

  /* ------------------------------------------------------------ workspace -- */
  .workspace {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    background:
      radial-gradient(1100px 520px at 76% -12%, var(--canvas-glow), transparent 66%),
      var(--canvas);
  }
  .workspace::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px; opacity: .62;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 58%);
    mask-image: linear-gradient(to bottom, #000, transparent 58%);
  }

  .topbar {
    position: relative; z-index: 6; flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    height: calc(64px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 26px 0;
    border-bottom: 1px solid var(--line);
    background: var(--canvas);
    background: color-mix(in srgb, var(--canvas) 84%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .topbar-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .topbar-eyebrow {
    font-size: 9px; font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: var(--muted);
  }
  #thread-title {
    display: block; max-width: 520px;
    font-size: 13.5px; font-weight: 550; line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar-actions { display: flex; align-items: center; gap: 7px; }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    font-size: 10.5px; white-space: nowrap;
  }
  .status i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .status[data-off="true"] i { background: var(--faint); box-shadow: 0 0 0 3px var(--surface-2); }
  .soft-button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 11px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--surface);
    color: var(--ink-2); font-size: 11.5px;
    transition: border-color .16s ease, background .16s ease, color .16s ease;
  }
  .soft-button:hover { border-color: var(--line-strong); background: var(--surface-2); color: var(--ink); }
  .soft-button .icon { width: 15px; height: 15px; }
  .icon-button {
    width: 32px; height: 32px; flex: 0 0 auto;
    display: grid; place-items: center; border-radius: 9px;
    color: var(--muted);
    transition: color .16s ease, background .16s ease;
  }
  .icon-button:hover { color: var(--ink); background: var(--surface-2); }
  .icon-button .icon { width: 18px; height: 18px; }
  .mobile-only { display: none; }
  .sidebar-close { display: none; }

  .chat-stage { position: relative; z-index: 1; flex: 1; min-height: 0; }

  .transcript {
    height: 100%; overflow-y: auto; overscroll-behavior: contain;
    padding: 34px clamp(20px, 4vw, 56px) 22px;
  }
  .transcript > * { width: min(820px, 100%); margin-left: auto; margin-right: auto; }

  /* ------------------------------------------------------------ empty hero -- */
  .empty-hero {
    position: absolute; inset: 0; z-index: 2;
    display: none; overflow-y: auto;
    justify-content: center; align-items: flex-start;
    padding: 30px clamp(20px, 5vw, 60px) 54px;
  }
  #transcript.empty + .empty-hero { display: flex; }
  .empty-inner {
    width: min(684px, 100%); margin: auto;
    text-align: center;
    animation: hero-in .55s cubic-bezier(.2, .8, .2, 1) both;
  }
  .hero-mark {
    width: 58px; height: 58px; margin: 0 auto 22px;
    display: grid; place-items: center; border-radius: 19px;
    color: var(--on-accent);
    background: linear-gradient(145deg, var(--accent) 0%, var(--accent-strong) 100%);
    box-shadow: 0 18px 40px -18px rgba(61, 86, 68, .65),
                inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .hero-mark .icon { width: 30px; height: 30px; stroke-width: 1.45; }
  .hero-eyebrow {
    margin-bottom: 11px;
    font-size: 10px; font-weight: 600; letter-spacing: .24em;
    text-transform: uppercase; color: var(--accent);
  }
  .empty-inner h2 {
    margin-bottom: 12px;
    font-family: var(--font-display);
    font-size: clamp(32px, 4vw, 43px);
    font-weight: 500; line-height: 1.18; letter-spacing: -.025em;
  }
  .empty-inner > p {
    max-width: 470px; margin: 0 auto 30px;
    color: var(--muted); font-size: 14px; line-height: 1.85;
  }
  .starter-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px; text-align: left;
  }
  .starter {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px;
    background: var(--surface); color: var(--ink-2);
    font-size: 12.5px; line-height: 1.5; text-align: left;
    box-shadow: var(--shadow-xs);
    transition: transform .16s ease, border-color .16s ease,
                box-shadow .16s ease, color .16s ease;
  }
  .starter::after {
    content: "→"; flex: 0 0 auto;
    color: var(--faint); font-size: 12px; transition: transform .16s ease, color .16s ease;
  }
  .starter:hover {
    transform: translateY(-1px); border-color: var(--line-strong);
    color: var(--ink); box-shadow: var(--shadow-sm);
  }
  .starter:hover::after { transform: translateX(2px); color: var(--accent); }
  .empty-inner .hero-foot {
    margin: 22px auto 0; font-size: 10.5px; color: var(--faint);
  }

  /* --------------------------------------------------------------- turns --- */
  .turn {
    display: flex; flex-direction: column;
    margin-bottom: 27px;
    animation: rise .3s cubic-bezier(.2, .8, .2, 1) both;
  }
  .turn.user { align-items: flex-end; }
  .bubble { max-width: 82%; min-width: 0; word-break: break-word; }

  .user .bubble {
    padding: 10px 15px;
    border: 1px solid var(--user-border);
    border-radius: 17px 17px 5px 17px;
    background: var(--user-bubble);
    box-shadow: var(--shadow-xs);
    white-space: pre-wrap;
    font-size: 14.5px; line-height: 1.75;
  }
  .user .text { font-size: 14.5px; line-height: 1.75; }

  .assistant .bubble {
    position: relative;
    max-width: 100%;
    padding: 1px 0 0 46px;
  }
  .assistant .bubble::before {
    content: "e";
    position: absolute; left: 0; top: 0;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 1px solid var(--user-border); border-radius: 10px;
    background: var(--accent-soft); color: var(--accent-strong);
    font-family: var(--font-display); font-size: 15px; font-weight: 600;
    line-height: 1;
  }
  .text {
    white-space: pre-wrap;
    font-size: 15px; line-height: 1.88;
  }
  .text[data-streaming="true"]::after {
    content: ""; display: inline-block;
    width: 2px; height: 1em; margin-left: 2px; vertical-align: -2px;
    background: var(--accent);
    animation: caret 1s step-end infinite;
  }

  .meta {
    display: flex; align-items: center; gap: 10px;
    min-height: 24px; margin-top: 4px;
    font-size: 11px; color: var(--muted);
  }
  .assistant .meta { padding-left: 46px; }
  .user .meta { display: none; }
  .meta > span:last-child { display: flex; align-items: center; gap: 2px; }
  .meta button {
    padding: 3px 8px; border: 1px solid transparent; border-radius: 7px;
    font-size: 11px; color: var(--muted);
    transition: color .14s ease, background .14s ease;
  }
  .meta button:hover { color: var(--ink-2); background: var(--surface-2); }
  .meta button[aria-pressed="true"] { color: var(--accent-strong); background: var(--accent-soft); }

  /* ------------------------------------------------------------ thinking ---
     A margin note, not the reply: separate muted tone, collapsed as soon as the
     answer starts, and still openable afterwards. */
  .thinking { margin: 0 0 11px; }
  .thinking[data-open="false"] .thinking-body { display: none; }
  .thinking-head {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px 5px 9px;
    border: 1px solid var(--think-border); border-radius: 999px;
    background: var(--think-bg); color: var(--think);
    font-size: 11px; line-height: 1.4; text-align: left;
    transition: border-color .16s ease;
  }
  .thinking-head:hover { border-color: var(--think); }
  .thinking-head .label { flex: 1; }
  .thinking-head .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--think);
    animation: think 1.6s ease-in-out infinite;
  }
  .thinking[data-state="done"] .thinking-head .dot { animation: none; opacity: .42; }
  .thinking-head .chev {
    width: 5px; height: 5px; margin-top: -2px; margin-left: 1px;
    border-right: 1.3px solid currentColor; border-bottom: 1.3px solid currentColor;
    transform: rotate(45deg); transition: transform .18s ease;
  }
  .thinking[data-open="true"] .thinking-head .chev { margin-top: 3px; transform: rotate(-135deg); }
  .thinking-body {
    margin-top: 8px; padding: 10px 12px;
    border: 1px solid var(--think-border); border-radius: 12px;
    background: var(--think-bg);
    color: var(--ink-2);
    font-size: 12.5px; line-height: 1.78;
    white-space: pre-wrap; word-break: break-word;
    max-height: 190px; overflow-y: auto; overscroll-behavior: contain;
  }
  .thinking[data-open="true"][data-state="live"] .thinking-body::after {
    content: ""; display: inline-block;
    width: 2px; height: .95em; margin-left: 2px; vertical-align: -2px;
    background: var(--think);
    animation: caret 1s step-end infinite;
  }

  .dots { display: inline-flex; align-items: center; gap: 5px; padding: 7px 1px; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
    animation: dot 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }

  .notice {
    margin: 0 auto 18px; padding: 11px 14px;
    border: 1px solid var(--warn-border); border-radius: 12px;
    background: var(--warn-bg); color: var(--warn-ink);
    font-size: 12.5px; line-height: 1.65;
  }

  /* ------------------------------------------------------------- composer -- */
  .composer-dock {
    position: relative; z-index: 6; flex: 0 0 auto;
    padding: 8px clamp(20px, 4vw, 56px) calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--canvas) 74%, transparent);
  }
  .composer-wrap { width: min(820px, 100%); margin: 0 auto; }
  .composer {
    padding: 3px;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: var(--surface); box-shadow: var(--shadow-md);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .composer:focus-within {
    border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
    box-shadow: 0 0 0 4px var(--accent-softer), var(--shadow-md);
  }
  textarea {
    display: block; width: 100%; max-height: 200px; min-height: 49px;
    padding: 12px 14px 4px;
    border: 0; outline: none; resize: none;
    background: transparent; color: var(--ink);
    font-size: 14.5px; line-height: 1.68;
  }
  textarea::placeholder { color: var(--faint); }
  textarea:focus { outline: none; }
  .composer-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 5px 5px 14px;
  }
  .composer-hint {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 6px;
    font-size: 10.5px; color: var(--faint);
    white-space: nowrap; overflow: hidden;
  }
  .composer-hint .icon { width: 12px; height: 12px; }
  .composer-hint kbd {
    padding: 0 4px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--surface-2); color: var(--muted);
    font-family: var(--font-sans); font-size: 9.5px; line-height: 1.6;
  }
  .hint-sep { opacity: .55; }
  .send {
    width: 37px; height: 37px; flex: 0 0 auto;
    display: grid; place-items: center; border-radius: 12px;
    background: var(--accent); color: var(--on-accent);
    box-shadow: 0 7px 16px -7px rgba(61, 86, 68, .65);
    transition: background .16s ease, transform .16s ease, opacity .16s ease;
  }
  .send:hover { background: var(--accent-strong); transform: translateY(-1px); }
  .send:active { transform: none; }
  .send:disabled { opacity: .5; transform: none; }
  .send .icon { width: 18px; height: 18px; stroke-width: 1.9; }
  .composer.has-text .send { background: var(--accent-strong); }
  .composer-foot {
    margin: 7px 0 0; text-align: center;
    font-size: 10px; color: var(--faint);
  }

  /* --------------------------------------------------------------- drawer -- */
  .drawer {
    position: fixed; inset: 0; z-index: 60;
    display: none; justify-content: flex-end;
    background: rgba(20, 18, 15, .4);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .drawer[data-open="true"] { display: flex; }
  .drawer-panel {
    width: min(452px, 100vw); height: 100%;
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
    background: var(--sidebar); box-shadow: var(--shadow-lg);
    animation: panel-in .3s cubic-bezier(.2, .8, .2, 1) both;
  }
  .panel-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: calc(22px + env(safe-area-inset-top)) 22px 17px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title { flex: 1; min-width: 0; }
  .panel-eyebrow {
    display: block; margin-bottom: 3px;
    font-size: 9px; font-weight: 600; letter-spacing: .2em;
    text-transform: uppercase; color: var(--accent);
  }
  .panel-title h2 {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 500; line-height: 1.2; letter-spacing: -.01em;
  }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 32px; }

  .memory-switch {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 15px; margin-bottom: 24px;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); box-shadow: var(--shadow-xs);
  }
  .memory-switch-copy { flex: 1; min-width: 0; }
  .memory-switch-copy strong { display: block; font-size: 13px; font-weight: 550; line-height: 1.5; }
  .memory-switch-copy p { margin-top: 4px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  #memory-enable {
    flex: 0 0 auto; min-width: 54px; height: 29px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface-2); color: var(--muted);
    font-size: 11px; font-weight: 550;
    transition: background .16s ease, color .16s ease, border-color .16s ease;
  }
  #memory-enable[aria-pressed="true"] {
    border-color: transparent; background: var(--accent); color: var(--on-accent);
  }

  .panel-section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 9px; padding: 0 2px;
  }
  .section-count { font-size: 10.5px; color: var(--muted); }
  .memory-list { display: flex; flex-direction: column; gap: 9px; }
  .memory {
    padding: 13px 14px 12px;
    border: 1px solid var(--line); border-radius: 13px;
    background: var(--surface); box-shadow: var(--shadow-xs);
  }
  .memory p { margin: 0; font-size: 13px; line-height: 1.72; color: var(--ink); }
  .tags {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    margin-top: 10px; font-size: 10px; color: var(--muted);
  }
  .tag {
    padding: 2px 8px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--muted); line-height: 1.5;
  }
  .tag.unconfirmed { border-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-ink); }
  .tags button {
    margin-left: auto; padding: 2px 7px; border-radius: 6px;
    font-size: 10px; color: var(--faint);
    transition: color .14s ease, background .14s ease;
  }
  .tags button:hover { color: var(--danger); background: var(--danger-soft); }

  .empty-note {
    padding: 26px 8px; text-align: center;
    color: var(--muted); font-size: 12.5px; line-height: 1.7;
  }

  .danger-zone {
    margin-top: 26px; padding: 15px;
    border: 1px solid var(--danger-border); border-radius: 14px;
    background: var(--danger-soft);
  }
  .danger-copy strong { display: block; font-size: 12.5px; font-weight: 550; color: var(--danger); }
  .danger-copy p { margin-top: 4px; font-size: 11.5px; line-height: 1.6; color: var(--muted); }
  .danger-zone button {
    width: 100%; margin-top: 12px; padding: 8px 10px;
    border: 1px solid var(--danger); border-radius: 9px;
    background: transparent; color: var(--danger);
    font-size: 11.5px; font-weight: 500;
    transition: background .16s ease, color .16s ease;
  }
  .danger-zone button:hover { background: color-mix(in srgb, var(--danger) 9%, transparent); }
  .danger-zone button[data-armed="true"] { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
  .danger-zone button:disabled { opacity: .62; }

  .primary {
    border: 1px solid var(--accent); border-radius: 8px;
    background: var(--accent); color: var(--on-accent); padding: 6px 11px; font-size: 12px;
  }
  .primary:hover { background: var(--accent-strong); }

  /* ------------------------------------------------------------ animation -- */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes hero-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes panel-in { from { transform: translateX(28px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  @keyframes dot { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes think { 0%, 100% { opacity: .3; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.1); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

  /* ----------------------------------------------------------- responsive -- */
  @media (max-width: 980px) {
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 35;
      width: min(320px, 87vw); flex-basis: auto;
      transform: translateX(-102%);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1);
      box-shadow: var(--shadow-lg);
    }
    .sidebar[data-open="true"] { transform: none; }
    .sidebar[data-open="true"] ~ .sidebar-scrim { opacity: 1; pointer-events: auto; }
    .sidebar-close { display: grid; }
    .mobile-only { display: grid; }
    .topbar {
      height: calc(60px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 16px 0; gap: 8px;
    }
    .transcript { padding: 26px 16px 18px; }
    .composer-dock { padding: 8px 14px calc(12px + env(safe-area-inset-bottom)); }
    .empty-hero { padding: 26px 20px 48px; }
  }

  @media (max-width: 620px) {
    .status { display: none; }
    .topbar-actions { gap: 2px; }
    .empty-inner h2 { font-size: clamp(29px, 8.5vw, 36px); }
    .empty-inner > p { font-size: 13px; margin-bottom: 24px; }
    .starter-grid { grid-template-columns: 1fr; gap: 8px; }
    .starter { padding: 12px 13px; font-size: 12px; }
    .hero-mark { width: 50px; height: 50px; border-radius: 16px; margin-bottom: 19px; }
    .hero-mark .icon { width: 26px; height: 26px; }
    .user .bubble { max-width: 90%; }
    .assistant .bubble { padding-left: 0; }
    .assistant .bubble::before { display: none; }
    .assistant .meta { padding-left: 0; }
    .text { font-size: 14.5px; }
    .composer-hint .hint-sep,
    .composer-hint .hint-keys { display: none; }
    .composer-foot { display: none; }
    .drawer-panel { width: 100vw; }
    .drawer-body { padding: 16px 16px calc(28px + env(safe-area-inset-bottom)); }
    .panel-head { padding: calc(18px + env(safe-area-inset-top)) 16px 15px; }
    /* iOS zooms the viewport when a focused field is under 16px. */
    textarea,
    .thread-rename input { font-size: 16px; }
    .thread-actions {
      position: static; transform: none; flex-direction: row;
      opacity: 1; pointer-events: auto;
      background: none; box-shadow: none; padding: 0 4px 0 0;
    }
    .thread { padding-right: 10px; }
    .thread-actions button { padding: 5px 6px; }
    .meta button { padding: 5px 9px; }
    .tags button { padding: 5px 9px; }
  }

  @media (hover: none) and (min-width: 621px) {
    .thread-actions {
      position: static; transform: none; flex-direction: row;
      opacity: 1; pointer-events: auto;
      background: none; box-shadow: none;
    }
    .thread { padding-right: 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="history" data-open="false" aria-label="对话列表">

            <path d="M12 15.5c1.4 0 2.6-.9 3.2-2.2"/>

        </div>

        <div id="history-note" class="history-note"></div>
        <div id="history-list" class="thread-list"></div>
      </div>
    </div>

          <svg class="icon theme-icon-moon" viewBox="0 0 24 24">

          </svg>
          <svg class="icon theme-icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>

  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <section class="workspace">

        <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="topbar-title">

            <path d="M12 3.2 13.7 8l4.8 1.7-4.8 1.7L12 16.2l-1.7-4.8L5.5 9.7 10.3 8 12 3.2Z"/>
          </svg>
          记忆
        </button>
        <button id="new-conversation-top" class="icon-button mobile-only" type="button" aria-label="新对话">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>

    <div class="chat-stage">

      <section class="empty-hero" aria-label="开始一段对话">

  <div class="drawer" id="drawer" data-open="false">

        <button id="drawer-close" class="icon-button" type="button" aria-label="关闭记忆">
          <svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>

      </header>

      <div class="drawer-body">
        <div class="memory-switch">
          <div class="memory-switch-copy">
            <strong>让 ta 参考记忆</strong>
            <p>关掉之后，新的对话不会读取任何记忆。已经存下的不会删除。</p>
          </div>
          <button id="memory-enable" type="button" aria-pressed="true">开</button>
        </div>

        <div class="panel-section-head">
          <span class="section-label">记住的事</span>
          <span id="memory-count" class="section-count"></span>
        </div>
        <div id="memory-list" class="memory-list"></div>

        <div class="danger-zone">
          <div class="danger-copy">
            <strong>删除全部数据</strong>
            <p>删掉 ta 记住的一切、所有对话和设置。无法撤销。</p>
          </div>
          <button id="forget-all" type="button">删除全部数据</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const transcript = $('transcript');
const input = $('input');
const sendButton = $('send');
const composer = $('composer');
const historyDrawer = $('history');
const titleEl = $('thread-title');
const root = document.documentElement;

const state = {
  conversationId: null,
  sending: false,
  memoryEnabled: true,
  showArchived: false,
  feedback: new Map(),
};

/** Titles from the conversation list, so the topbar and sidebar agree. */
const conversationTitles = new Map();
/** The row element per conversation, so the active state can move without a refetch. */
const threadNodes = new Map();
/** Only the newest list request may paint; older ones are discarded on arrival. */
let historyRequest = 0;

// ---------------------------------------------------------------- render ----

/** Everything user- or model-authored goes in via textContent, never HTML. */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/** The conversation title in the topbar. Empty means "nothing chosen yet". */
function setThreadTitle(text) {
  if (titleEl) titleEl.textContent = text;
}

/**
 * Adopt the listed title for the open conversation.
 *
 * Deliberately a no-op when the id is not in the list: a new conversation has
 * no row yet, and its optimistic title should survive until the server names it.
 */
function updateThreadTitle() {
  if (!state.conversationId) {
    setThreadTitle('新的对话');
    return;
  }
  const title = conversationTitles.get(state.conversationId);
  if (title) setThreadTitle(title);
}

/** Move the selected state between rows without re-fetching the list. */
function markActiveThread() {
  for (const [id, node] of threadNodes) {
    const active = id === state.conversationId;
    node.setAttribute('aria-current', String(active));
    // `parent` exists in the test shim; `parentElement` is the browser's.
    const row = node.parentElement ?? node.parent;
    if (!row) continue;
    if (active) row.classList.add('active');
    else row.classList.remove('active');
  }
}

/** Mirror the server's derived-title rule for the instant before the list lands. */
function deriveTitle(text) {
  const flat = text.replace(/\s+/g, ' ').trim();
  return flat.length <= 24 ? flat : `${flat.slice(0, 24)}…`;
}

/** Keep the memory badge in the topbar honest after either panel is read. */
function setMemoryStatus(enabled) {
  const status = $('memory-status');
  if (status) status.dataset.off = String(!enabled);
  const label = $('memory-status-label');
  if (label) label.textContent = enabled ? '长期记忆' : '记忆已关';
}

/** The three dots for the gap before any content at all has arrived. */
function dots() {
  const box = el('div', 'dots');
  box.append(el('span'), el('span'), el('span'));
  return box;
}

function addTurn(role, text = '') {
  transcript.classList.remove('empty');
  const turn = el('div', `turn ${role}`);
  const bubble = el('div', 'bubble');
  const body = el('div', 'text', text);
  bubble.append(body);
  turn.append(bubble);

  const meta = el('div', 'meta');
  const note = el('span');
  const actions = el('span');
  meta.append(note, actions);
  turn.append(meta);

  transcript.append(turn);
  scrollToEnd();
  return { turn, bubble, text: body, note, actions };
}

/**
 * The reasoning block.
 *
 * The model thinks for several seconds before its first visible character, and
 * without this the person watches a motionless `…` and cannot tell a slow reply
 * from a stalled one. It is shown as a margin note rather than as part of the
 * reply — its own muted tone, and closed the moment the answer begins — so the
 * answer stays the thing being read. See ADR 010.
 *
 * Built from DOM nodes rather than markup because the text inside is model
 * output, and the chevron is drawn from a border so no icon markup is needed.
 */
function addThinking(bubble) {
  const box = el('div', 'thinking');
  box.dataset.open = 'true';
  box.dataset.state = 'live';

  const label = el('span', 'label', '正在想…');
  const head = el('button', 'thinking-head');
  head.type = 'button';
  head.setAttribute('aria-expanded', 'true');
  head.append(el('span', 'dot'), label, el('span', 'chev'));

  const stream = el('span');
  const body = el('div', 'thinking-body');
  body.append(stream);

  box.append(head, body);
  bubble.prepend(box);

  let open = true;
  // Once the person opens or closes it themselves, stop deciding for them.
  let touched = false;
  let tailing = true;
  let closed = false;

  const setOpen = (next) => {
    open = next;
    box.dataset.open = String(next);
    head.setAttribute('aria-expanded', String(next));
  };
  head.onclick = () => {
    touched = true;
    setOpen(!open);
  };

  // Follow the tail while it streams, but do not fight someone who has
  // scrolled up to read what was already said.
  body.addEventListener('scroll', () => {
    tailing = body.scrollHeight - body.scrollTop - body.clientHeight < 24;
  });

  return {
    append(text) {
      stream.textContent += text;
      if (tailing) body.scrollTop = body.scrollHeight;
    },
    /** Idempotent: the first close wins, whichever path reached it. */
    close(summary) {
      if (closed) return;
      closed = true;
      box.dataset.state = 'done';
      label.textContent = summary;
      if (!touched) setOpen(false);
    },
    finish(elapsedMs) {
      // Round up: "思考了 0 秒" reads as a bug even when it is accurate.
      this.close(`思考了 ${Math.max(1, Math.round(elapsedMs / 1000))} 秒`);
    },
    abort() {
      this.close('思考过程');
    },
  };
}

function scrollToEnd() {
  transcript.scrollTop = transcript.scrollHeight;
}

function notice(text) {
  const box = el('div', 'notice', text);
  transcript.classList.remove('empty');
  transcript.append(box);
  scrollToEnd();
}

// ------------------------------------------------------------ transport ----

/**
 * Parse an SSE byte stream by hand.
 *
 * `EventSource` cannot be used: it only issues GET, and the chat endpoint is
 * POST — putting a person's message in a URL would leak it into access logs and
 * browser history. Reading the body as a stream is also exactly what the
 * mini-program client has to do, so this logic transfers rather than being
 * thrown away.
 */
async function* readFrames(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let boundary = buffer.indexOf('\n\n');
    while (boundary >= 0) {
      const frame = buffer.slice(0, boundary);
      buffer = buffer.slice(boundary + 2);
      const line = frame.split('\n').find((l) => l.startsWith('data: '));
      if (line) {
        try {
          yield JSON.parse(line.slice(6));
        } catch {
          // A malformed frame is dropped rather than killing the stream; the
          // next one is probably fine.
        }
      }
      boundary = buffer.indexOf('\n\n');
    }
  }
}

async function send(text) {
  if (state.sending) return;
  state.sending = true;
  sendButton.disabled = true;
  input.value = '';
  resize();

  // The server derives a title from the first message, but the sidebar and the
  // topbar should not sit on "新的对话" while it does. This is the same rule.
  if (!state.conversationId || !conversationTitles.get(state.conversationId)) {
    setThreadTitle(deriveTitle(text));
  }

  addTurn('user', text);
  const { bubble, text: body, note, actions } = addTurn('assistant');
  const waiting = dots();
  body.append(waiting);
  body.dataset.streaming = 'true';

  let thinking = null;
  let reply = '';
  let messageId = null;
  let risk = 'none';
  let toolNote = '';

  /** Drop the placeholder the moment there is anything real to show. */
  const settled = () => {
    if (waiting.isConnected) waiting.remove();
  };

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversationId: state.conversationId }),
    });

    if (!response.ok || !response.body) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || `HTTP ${response.status}`);
    }

    for await (const event of readFrames(response)) {
      if (event.type === 'thinking_delta') {
        settled();
        // Created on the first delta, so a turn the model answers without
        // thinking never grows an empty block.
        thinking ??= addThinking(bubble);
        thinking.append(event.text);
      } else if (event.type === 'thinking_done') {
        thinking?.finish(event.elapsedMs);
      } else if (event.type === 'text_delta') {
        settled();
        // The server always closes the block before the first reply delta, so
        // this only fires if that ever stops being true.
        thinking?.abort();
        reply += event.text;
        body.textContent = reply;
        scrollToEnd();
      } else if (event.type === 'memory_retrieved') {
        note.textContent = event.count > 0 ? `参考了 ${event.count} 条记忆` : '';
      } else if (event.type === 'safety_notice') {
        risk = event.level;
        if (event.replaced) notice('这一轮触发了安全回应。如果你现在很危险，请打 120 或 110。');
      } else if (event.type === 'completed') {
        reply = event.text;
        body.textContent = reply;
        // Only when the server names one: a turn that was not persisted reports
        // null, and taking that at face value would forget a conversation that
        // is still perfectly good.
        if (event.conversationId) {
          const untitled = !conversationTitles.get(event.conversationId);
          rememberConversation(event.conversationId);
          // The first persisted turn is also the moment the conversation earns
          // its title and its row, so this is the one refresh that matters.
          if (untitled) void refreshHistory();
        }
        messageId = event.messageId ?? null;
      } else if (event.type === 'error') {
        throw new Error(event.message);
      } else if (event.type === 'tool_call') {
        note.textContent = '（回想中…）';
        toolNote = '（回想中…）';
      }
    }

    // A tool note is transient: it described the moment, not the turn.
    if (note.textContent === toolNote) note.textContent = '';
    if (messageId) addFeedback(actions, messageId);
  } catch (error) {
    // A half-shown thought with no ending is worse than none; close it.
    thinking?.abort();
    settled();
    body.textContent = '';
    body.append(el('span', null, `出错了：${error.message}`));
    body.style.color = 'var(--danger)';
  } finally {
    // Whether it finished, failed, or was cut off, nothing is arriving now.
    delete body.dataset.streaming;
    state.sending = false;
    sendButton.disabled = false;
    scrollToEnd();
  }
}

function addFeedback(actions, messageId) {
  actions.textContent = '';
  const up = el('button', null, '有帮助');
  const down = el('button', null, '不太对');
  up.type = 'button';
  down.type = 'button';

  const rate = async (rating) => {
    state.feedback.set(messageId, rating);
    up.setAttribute('aria-pressed', String(rating === 'good'));
    down.setAttribute('aria-pressed', String(rating === 'bad'));
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messageId, rating }),
    }).catch(() => undefined);
  };

  up.onclick = () => void rate('good');
  down.onclick = () => void rate('bad');
  actions.append(up, down);
}

// --------------------------------------------------------- conversations ----

/**
 * The conversation id survives a reload.
 *
 * `localStorage` rather than the URL, because a URL is a thing people paste and
 * a conversation is private. Both directions are wrapped: storage throws in some
 * privacy modes, and failing to remember which conversation this is costs less
 * than a page that will not start.
 */
const STORAGE_KEY = 'df_conversation';

function rememberConversation(id) {
  state.conversationId = id;
  try {
    if (id) localStorage.setItem(STORAGE_KEY, id);
    else localStorage.removeItem(STORAGE_KEY);
  } catch {
    // The conversation still works for this page view; only the reload is lost.
  }
  markActiveThread();
  if (!id) setThreadTitle('新的对话');
  else updateThreadTitle();
}

function recallConversation() {
  try {
    return localStorage.getItem(STORAGE_KEY);
  } catch {
    return null;
  }
}

/** "刚刚" / "12 分钟前" / "3 小时前" / "9 月 28 日" */
function whenLabel(iso) {
  const then = new Date(iso);
  if (Number.isNaN(then.getTime())) return '';
  const minutes = Math.round((Date.now() - then.getTime()) / 60000);
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return `${minutes} 分钟前`;
  if (minutes < 60 * 24) return `${Math.round(minutes / 60)} 小时前`;
  return `${then.getMonth() + 1} 月 ${then.getDate()} 日`;
}

/**
 * Render a stored conversation.
 *
 * No streaming and no reasoning block: those described a turn while it was
 * happening, and replaying them would be a re-enactment rather than a record.
 * What is drawn is what was said.
 */
async function loadConversation(id) {
  const response = await fetch(`/api/conversations/${id}/messages`).catch(() => null);
  if (!response || !response.ok) return false;

  // `?? []` rather than trusting the shape: a proxy or a future server that
  // answers 200 with something else should leave the page usable, not throw
  // inside a click handler where nothing is listening for it.
  const { messages = [] } = await response.json();
  if (messages.length === 0) return false;

  transcript.textContent = '';
  transcript.classList.remove('empty');
  for (const message of messages) {
    const { actions } = addTurn(message.role, message.content);
    if (message.role === 'assistant') addFeedback(actions, message.id);
  }
  rememberConversation(id);
  setThreadTitle(conversationTitles.get(id) ?? '对话');
  scrollToEnd();
  return true;
}

function setHistoryNote(text) {
  $('history-note').textContent = text;
}

/** Clear the transcript and forget which conversation it was. */
function clearConversationView() {
  rememberConversation(null);
  transcript.textContent = '';
  transcript.classList.add('empty');
  // On mobile the list covers the canvas; starting a new conversation is a
  // decision to leave it.
  if (historyDrawer) historyDrawer.dataset.open = 'false';
  input.focus();
}

async function refreshHistory() {
  const request = ++historyRequest;
  const list = $('history-list');
  list.textContent = '';
  setHistoryNote('');
  threadNodes.clear();
  conversationTitles.clear();

  // Archived rows are a separate view, not a second list. The server keeps them
  // out of the ordinary response, so the toggle has to ask for them explicitly.
  const response = await fetch(
    state.showArchived ? '/api/conversations?includeArchived=1' : '/api/conversations',
  ).catch(() => null);
  // A slower earlier request has nothing useful to say about the current view.
  if (request !== historyRequest) return;
  if (!response || !response.ok) {
    list.append(el('div', 'empty-note', '读不到历史对话。'));
    return;
  }

  const { conversations = [] } = await response.json();
  if (request !== historyRequest) return;
  if (conversations.length === 0) {
    list.append(el('div', 'empty-note', '还没有对话，从第一句开始吧。'));
    return;
  }

  for (const conversation of conversations) {
    const archived = Boolean(conversation.archivedAt);
    const row = el('div', 'thread-row');
    if (conversation.id === state.conversationId) row.classList.add('active');

    const open = el('button', 'thread');
    open.type = 'button';
    const named = Boolean(conversation.title);
    // The mark is the first grid cell, but `name` and `when` stay direct
    // children so a row can still be read without unpacking a wrapper.
    open.append(el('span', 'thread-mark'));
    open.append(
      el('span', `name${named ? '' : ' unnamed'}`, conversation.title ?? '（没有名字的对话）'),
    );
    const when = whenLabel(conversation.lastTurnAt ?? conversation.startedAt);
    open.append(el('span', 'when', archived ? `${when} · 已归档` : when));
    open.setAttribute('aria-current', String(conversation.id === state.conversationId));
    open.onclick = async () => {
      // Already open: just close the drawer rather than re-fetching what is
      // already on screen.
      if (conversation.id !== state.conversationId) await loadConversation(conversation.id);
      if (historyDrawer) historyDrawer.dataset.open = 'false';
    };

    threadNodes.set(conversation.id, open);
    conversationTitles.set(conversation.id, conversation.title ?? '');

    // A conversation has a lifecycle, so the row does too: rename and archive
    // are reversible; delete asks twice because it is not.
    const actions = el('div', 'thread-actions');
    const rename = el('button', null, '改名');
    rename.type = 'button';
    rename.onclick = () => beginRename(row, conversation);

    const archive = el('button', null, archived ? '恢复' : '归档');
    archive.type = 'button';
    archive.onclick = () => void setArchived(conversation, !archived);

    const remove = el('button', 'thread-delete', '删除');
    remove.type = 'button';
    remove.onclick = () => void deleteThread(conversation, remove);

    actions.append(rename, archive, remove);
    row.append(open, actions);
    list.append(row);
  }

  // No title to adopt for a brand-new conversation; the composer keeps the
  // optimistic one set at send time until the server names it.
  if (state.conversationId) updateThreadTitle();
}

function beginRename(row, conversation) {
  setHistoryNote('');
  row.textContent = '';

  const editor = el('div', 'thread-rename');
  const field = el('input');
  field.value = conversation.title ?? '';
  field.setAttribute('maxlength', '80');
  field.setAttribute('aria-label', '对话名称');

  const save = el('button', 'primary', '保存');
  save.type = 'button';
  const cancel = el('button', null, '取消');
  cancel.type = 'button';

  const commit = async () => {
    save.disabled = true;
    const response = await fetch(`/api/conversations/${conversation.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: field.value }),
    }).catch(() => null);
    save.disabled = false;

    if (!response || !response.ok) {
      setHistoryNote('改名失败，稍后再试。');
      field.focus();
      return;
    }
    await refreshHistory();
  };

  save.onclick = () => void commit();
  cancel.onclick = () => void refreshHistory();
  field.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      void commit();
    } else if (event.key === 'Escape') {
      void refreshHistory();
    }
  });

  editor.append(field, save, cancel);
  row.append(editor);
  field.focus();
}

async function setArchived(conversation, archived) {
  setHistoryNote('');
  const response = await fetch(`/api/conversations/${conversation.id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ archived }),
  }).catch(() => null);

  if (!response || !response.ok) {
    setHistoryNote(archived ? '归档失败，稍后再试。' : '恢复失败，稍后再试。');
    return;
  }

  // Archiving the conversation that is on screen would leave an open thread
  // with no row in the list. Start clean instead of hiding it underneath.
  if (archived && state.conversationId === conversation.id) clearConversationView();
  await refreshHistory();
}

async function deleteThread(conversation, button) {
  if (button.dataset.armed !== 'true') {
    button.dataset.armed = 'true';
    button.textContent = '确认删除';
    setTimeout(() => {
      if (!button.isConnected) return;
      button.dataset.armed = 'false';
      button.textContent = '删除';
    }, 4000);
    return;
  }

  setHistoryNote('');
  button.disabled = true;
  button.textContent = '删除中…';
  const response = await fetch(`/api/conversations/${conversation.id}`, {
    method: 'DELETE',
  }).catch(() => null);

  if (!response || !response.ok) {
    setHistoryNote('删除失败，稍后再试。');
    button.disabled = false;
    button.dataset.armed = 'false';
    button.textContent = '删除';
    return;
  }

  if (state.conversationId === conversation.id) clearConversationView();
  await refreshHistory();
}

// -------------------------------------------------------------- memory ------

async function openDrawer() {
  // On mobile the drawer and the conversation list are two layers; opening the
  // upper one should put the lower one away.
  if (historyDrawer) historyDrawer.dataset.open = 'false';
  $('drawer').dataset.open = 'true';
  await refreshMemory();
}

async function refreshMemory() {
  const list = $('memory-list');
  list.textContent = '';

  const response = await fetch('/api/memory').catch(() => null);
  if (!response || !response.ok) {
    list.append(el('div', 'empty-note', '读不到记忆。'));
    return;
  }

  const { memories, enabled } = await response.json();
  state.memoryEnabled = enabled;
  $('memory-enable').textContent = enabled ? '开' : '关';
  $('memory-enable').setAttribute('aria-pressed', String(enabled));
  setMemoryStatus(enabled);

  const active = memories.filter((m) => m.status !== 'deleted');
  const count = $('memory-count');
  if (count) count.textContent = active.length > 0 ? `${active.length} 条` : '';
  if (active.length === 0) {
    list.append(el('div', 'empty-note', '还没有记住什么。'));
    return;
  }

  const sourceLabels = {
    user_explicit: '你让我记住的',
    user_stated: '你说过的',
    inferred: '我的推测',
  };
  const typeLabels = { episodic: '一件事', semantic: '关于你', narrative: '你正在经历的' };

  for (const memory of active) {
    const item = el('div', 'memory');
    item.append(el('p', null, memory.content));

    const tags = el('div', 'tags');
    const label = el('span', 'tag' + (memory.status === 'unconfirmed' ? ' unconfirmed' : ''),
      `${sourceLabels[memory.source] ?? memory.source} · ${typeLabels[memory.type] ?? memory.type}` +
      (memory.status === 'unconfirmed' ? ' · 待确认' : ''));
    tags.append(label);

    if (memory.accessCount > 0) tags.append(el('span', null, `被想起 ${memory.accessCount} 次`));

    const remove = el('button', null, '删除');
    remove.type = 'button';
    remove.onclick = async () => {
      await fetch(`/api/memory/${memory.id}`, { method: 'DELETE' }).catch(() => undefined);
      await refreshMemory();
    };
    tags.append(remove);

    item.append(tags);
    list.append(item);
  }
}

// ------------------------------------------------------- forgetting all -----

/**
 * Delete everything (spec §44, `deletion`).
 *
 * Two clicks rather than a `confirm()` dialog, for the same reason the rest of
 * this panel avoids modals: a browser dialog is a thing people dismiss on
 * reflex, and the reflex is trained by dialogs that do not matter. Arming the
 * button changes what it says and what it looks like, so the second click is
 * made deliberately.
 *
 * The armed state expires, because a button left armed while the drawer sits
 * open is a button that eventually gets clicked by someone who has forgotten
 * why it is red.
 */
const FORGET_ARM_MS = 5000;
let forgetTimer = null;

async function forgetEverything() {
  const button = $('forget-all');
  const armed = button.dataset.armed === 'true';

  if (!armed) {
    button.dataset.armed = 'true';
    button.textContent = '再点一次，删除';
    clearTimeout(forgetTimer);
    forgetTimer = setTimeout(disarmForget, FORGET_ARM_MS);
    return;
  }

  clearTimeout(forgetTimer);
  button.disabled = true;
  button.textContent = '正在删除…';

  const response = await fetch('/api/me', { method: 'DELETE' }).catch(() => null);
  button.disabled = false;

  if (!response || !response.ok) {
    // Left armed would be a trap: the next click would delete after a failure
    // the person was never told about.
    disarmForget();
    button.textContent = '删除失败，稍后再试';
    return;
  }

  // The client's half of the deletion. The cookie is gone, so the conversation
  // id in `localStorage` now points at nothing, and a transcript left on screen
  // would be the only remaining copy of what was just deleted.
  rememberConversation(null);
  transcript.textContent = '';
  transcript.classList.add('empty');
  $('history-list').textContent = '';
  disarmForget();
  button.textContent = '都删掉了';
  // The transcript's empty state is a stylesheet rule, not an element, so the
  // confirmation goes where the click was rather than over the top of it.
  setTimeout(() => { if (!button.disabled) button.textContent = '删除全部数据'; }, 2500);
}

function disarmForget() {
  const button = $('forget-all');
  button.dataset.armed = 'false';
  button.textContent = '删除全部数据';
}

// --------------------------------------------------------------- events -----

function resize() {
  input.style.height = 'auto';
  input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
  if (input.value.trim()) composer.classList.add('has-text');
  else composer.classList.remove('has-text');
}

// The theme is written onto <html> by the inline head script before first
// paint; this only has to keep the label and the stored choice in sync.
function currentTheme() {
  return root && root.dataset.theme === 'dark' ? 'dark' : 'light';
}

function paintThemeLabel(theme) {
  const label = $('theme-label');
  if (label) label.textContent = theme === 'dark' ? '浅色模式' : '深色模式';
}

paintThemeLabel(currentTheme());
$('theme-toggle').onclick = () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  if (root) root.dataset.theme = next;
  try {
    localStorage.setItem('df_theme', next);
  } catch {
    // The choice still applies for this page view.
  }
  paintThemeLabel(next);
};

// The empty state is a set of openers, not a form. Picking one puts the words
// in the composer so they can be changed before they are sent.
const starters = [
  ['starter-1', '今天有点累，不想说话'],
  ['starter-2', '帮我理一理最近的想法'],
  ['starter-3', '记住：我喜欢下雨天'],
  ['starter-4', '随便聊聊就好'],
];
for (const [id, prompt] of starters) {
  const button = $(id);
  if (!button) continue;
  button.onclick = () => {
    input.value = prompt;
    resize();
    input.focus();
  };
}

const greeting = $('greeting');
if (greeting) {
  const hour = new Date().getHours();
  greeting.textContent =
    hour < 6 ? '还醒着吗？' : hour < 12 ? '早上好。' : hour < 18 ? '下午好。' : '晚上好。';
}

input.addEventListener('input', resize);
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    $('composer').requestSubmit();
  }
});

$('composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (text.length > 0) void send(text);
});

// Forget the id as well as clearing the screen: otherwise the next reload
// would pull the old conversation back and the "new" one would have been a view
// change rather than a new conversation.
function startNewConversation() {
  clearConversationView();
}

$('new-conversation').onclick = startNewConversation;
$('new-conversation-top').onclick = startNewConversation;

$('memory-toggle').onclick = () => void openDrawer();
$('memory-toggle-top').onclick = () => void openDrawer();
$('forget-all').onclick = () => void forgetEverything();
// Closing the drawer disarms: an armed button that survives being put away is
// an armed button someone finds later without the context that made it red.
$('drawer-close').onclick = () => {
  $('drawer').dataset.open = 'false';
  disarmForget();
};
$('drawer').addEventListener('click', (event) => {
  if (event.target === $('drawer')) {
    $('drawer').dataset.open = 'false';
    disarmForget();
  }
});

$('history-toggle').onclick = () => {
  if (historyDrawer) historyDrawer.dataset.open = 'true';
  void refreshHistory();
};
$('history-close').onclick = () => {
  if (historyDrawer) historyDrawer.dataset.open = 'false';
};
$('sidebar-scrim').onclick = () => {
  if (historyDrawer) historyDrawer.dataset.open = 'false';
};
$('history-archived').onclick = () => {
  state.showArchived = !state.showArchived;
  $('history-archived').setAttribute('aria-pressed', String(state.showArchived));
  $('history-archived').textContent = state.showArchived ? '隐藏已归档' : '显示已归档';
  void refreshHistory();
};

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  for (const id of ['drawer', 'history']) {
    if ($(id).dataset.open === 'true') $(id).dataset.open = 'false';
  }
});

$('memory-enable').onclick = async () => {
  state.memoryEnabled = !state.memoryEnabled;
  await fetch('/api/preferences', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ 'memory.enabled': state.memoryEnabled }),
  }).catch(() => undefined);
  await refreshMemory();
};

/**
 * The last conversation comes back on reload.
 *
 * This is the whole point of storing the id: a companion you have to re-introduce
 * yourself to every time you open the page is not keeping anything. Failures are
 * silent — the stored id is kept rather than cleared, because a request that
 * failed once says nothing about whether the conversation still exists, and the
 * server treats an id that is not this user's as "start a new one" anyway.
 */
async function restore() {
  const saved = recallConversation();
  if (!saved) return;
  // Adopted before the fetch, not after: if reading the messages fails, the next
  // message still continues that conversation instead of quietly starting a new
  // one and leaving the thread behind.
  state.conversationId = saved;
  await loadConversation(saved);
}

/** The badge describes the preference even before the memory drawer is opened. */
async function refreshMemoryStatus() {
  const response = await fetch('/api/preferences').catch(() => null);
  if (!response || !response.ok) return;
  const payload = await response.json().catch(() => ({}));
  setMemoryStatus(payload.memoryEnabled !== false);
}

/**
 * Read the page in one order rather than three parallel ones.
 *
 * Identity is minted by the first request that has no cookie, so a first-ever
 * visit used to be able to open two of them at once and leave an orphaned user
 * row behind. The transcript is the thing worth waiting for; the list and the
 * badge can follow it.
 */
async function bootstrap() {
  await restore().catch(() => undefined);
  await refreshHistory();
  await refreshMemoryStatus();
}

resize();
input.focus();
void bootstrap();
</script>
</body>
</html>
