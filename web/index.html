<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eunoia</title>
<style>
  /* Tokens first, so a colour is changed in one place. */
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e8e4dd;
    --text: #2f2c28;
    --muted: #86807a;
    --accent: #6b7f6e;
    --accent-soft: #eef2ee;
    --danger: #a4553f;
    --warn-bg: #fdf6ec;
    --warn-border: #e8d5b0;
    /* The reasoning block gets its own tone rather than reusing the accent:
       it is not part of the reply, and it should read as a margin note. */
    --think: #b08a4a;
    --think-bg: #fbf7f0;
    --think-border: #e6d9c2;
    --shadow: 0 1px 2px rgba(47, 44, 40, .05);
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --surface: #262421;
      --border: #3a3733;
      --text: #e8e4dd;
      --muted: #948e87;
      --accent: #93a896;
      --accent-soft: #2f3630;
      --danger: #d08a72;
      --warn-bg: #33291d;
      --warn-border: #574430;
      --think: #c9a468;
      --think-bg: #2a251d;
      --think-border: #443a2b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .22);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }

  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex: 0 0 auto;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
  header .sub { font-size: 12px; color: var(--muted); font-weight: 400; }

  button {
    font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }

  main { flex: 1 1 auto; overflow-y: auto; padding: 20px 16px 8px; }
  main.empty::before {
    content: "说点什么吧。\A这里没有别人。";
    white-space: pre-line;
    display: block; margin-top: 22vh; text-align: center;
    color: var(--muted); font-size: 14px; line-height: 2;
  }

  .turn { margin-bottom: 20px; display: flex; flex-direction: column; animation: rise .26s ease-out; }
  .turn.user { align-items: flex-end; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .bubble {
    max-width: 84%; padding: 10px 14px; border-radius: var(--radius);
    word-break: break-word;
  }
  .user .bubble { background: var(--accent-soft); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .assistant .bubble {
    background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; box-shadow: var(--shadow);
  }

  /* The reply itself. `pre-wrap` lives here rather than on the bubble so the
     thinking block above it is not affected by the reply's whitespace. */
  .text { white-space: pre-wrap; }
  .text[data-streaming="true"]::after {
    content: ""; display: inline-block; width: 2px; height: 1em;
    margin-left: 2px; vertical-align: -2px; background: var(--accent);
    animation: caret 1s step-end infinite;
  }
  @keyframes caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  /* Three dots for the gap before anything at all has arrived — the ~1.5s
     between sending and the first reasoning token. */
  .dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: dot 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .18s; }
  .dots span:nth-child(3) { animation-delay: .36s; }
  @keyframes dot { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

  /* -------------------------------------------------------- thinking ------
     The model thinks for several seconds before its first visible character.
     This is that window, shown rather than hidden.

     It is a margin note, not part of the reply: a separate muted tone, closed
     the moment the answer starts, and openable if the person wants to read it.
     See docs/adr/010-reasoning-is-forwarded.md. */
  .thinking { margin: 0 0 10px; }
  .thinking[data-open="false"] .thinking-body { display: none; }

  .thinking-head {
    display: flex; align-items: center; gap: 7px; width: 100%;
    margin: 0; padding: 0; border: none; background: transparent;
    font: inherit; font-size: 12.5px; color: var(--muted);
    text-align: left; cursor: pointer;
  }
  .thinking-head:hover { color: var(--think); }
  .thinking-head .label { flex: 1; }
  .thinking-head .dot {
    flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%;
    background: var(--think); animation: think 1.6s ease-in-out infinite;
  }
  @keyframes think { 0%, 100% { opacity: .3; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.1); } }
  .thinking[data-state="done"] .thinking-head .dot { animation: none; opacity: .45; transform: none; }

  /* A chevron drawn from one border, so no markup has to carry an icon. */
  .thinking-head .chev {
    flex: 0 0 auto; width: 5px; height: 5px; margin-top: -3px;
    border-right: 1.4px solid currentColor; border-bottom: 1.4px solid currentColor;
    transform: rotate(45deg); transition: transform .18s ease;
  }
  .thinking[data-open="true"] .thinking-head .chev { margin-top: 2px; transform: rotate(-135deg); }

  .thinking-body {
    margin-top: 8px; padding: 9px 12px;
    border-left: 2px solid var(--think-border); border-radius: 0 8px 8px 0;
    background: var(--think-bg);
    font-size: 13px; line-height: 1.75; color: var(--muted);
    white-space: pre-wrap; word-break: break-word;
    max-height: 170px; overflow-y: auto; overscroll-behavior: contain;
  }
  .thinking[data-open="true"][data-state="live"] .thinking-body::after {
    content: ""; display: inline-block; width: 2px; height: .95em;
    margin-left: 2px; vertical-align: -2px; background: var(--think);
    animation: caret 1s step-end infinite;
  }

  .meta { font-size: 12px; color: var(--muted); margin: 6px 2px 0; display: flex; gap: 12px; align-items: center; min-height: 22px; }
  .meta button { border: none; padding: 2px 6px; font-size: 12px; }
  .meta button[aria-pressed="true"] { color: var(--accent); }

  .notice {
    margin: 0 0 16px; padding: 10px 14px; border-radius: var(--radius);
    background: var(--warn-bg); border: 1px solid var(--warn-border);
    font-size: 13px; line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .turn, .dots span, .thinking-head .dot { animation: none; }
  }

  footer { flex: 0 0 auto; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; max-height: 160px; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  /* Memory drawer */
  .drawer {
    position: fixed; inset: 0; background: rgba(0,0,0,.32);
    display: none; justify-content: flex-end; z-index: 20;
  }
  .drawer[data-open="true"] { display: flex; }
  .drawer-panel {
    width: min(440px, 92vw); height: 100%; background: var(--bg);
    display: flex; flex-direction: column; border-left: 1px solid var(--border);
  }
  .drawer-panel header { border-bottom: 1px solid var(--border); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: none; }
  .memory { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .memory p { margin: 0 0 6px; font-size: 14px; line-height: 1.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .tag { border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .tag.unconfirmed { border-color: var(--warn-border); background: var(--warn-bg); }
  .empty-note { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .danger-zone { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .danger-zone .sub { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 6px; }
  .danger-zone button { color: var(--danger); border-color: var(--danger); }
  /* Armed. The second click is the one that deletes, so it must not look like
     the first one did. */
  .danger-zone button[data-armed="true"] { background: var(--danger); color: var(--bg); }

  /* Conversation history. The open control is still a real button: it is
     focusable, answers to Enter, and reads as pressable. The lifecycle actions
     sit beside it rather than inside it, because a button cannot contain
     another button. */
  .thread-row { display: flex; align-items: stretch; gap: 2px; margin: 0 0 6px; }
  .thread {
    flex: 1 1 auto; min-width: 0; display: block; width: 100%; text-align: left; cursor: pointer;
    padding: 11px 12px; margin: 0; border-radius: 8px;
    border: 1px solid transparent; background: none; color: inherit;
    font: inherit; line-height: 1.5;
  }
  .thread:hover { background: var(--think-bg); }
  .thread[aria-current="true"] { background: var(--think-bg); border-color: var(--think-border); }
  .thread .name { font-size: 14px; display: block; }
  .thread .name.unnamed { color: var(--muted); }
  .thread .when { font-size: 12px; color: var(--muted); margin-top: 3px; display: block; }
  .thread-actions { display: flex; flex-direction: column; justify-content: center; gap: 1px; flex: 0 0 auto; }
  .thread-actions button {
    border: none; background: none; color: var(--muted); font: inherit;
    font-size: 11px; line-height: 1.4; padding: 1px 5px; border-radius: 4px; cursor: pointer;
  }
  .thread-actions button:hover { color: var(--accent); }
  .thread-actions button.thread-delete:hover { color: var(--danger); }
  .thread-actions button[data-armed="true"] { background: var(--danger); color: var(--bg); }
  .thread-actions button[data-armed="true"]:hover { color: var(--bg); }
  .thread-rename { display: flex; flex: 1 1 auto; gap: 4px; align-items: center; padding: 6px 0; }
  .thread-rename input {
    flex: 1 1 auto; min-width: 0; padding: 6px 8px; font: inherit; font-size: 13px;
    color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  .thread-rename input:focus { outline: none; border-color: var(--accent); }
  .thread-rename button { font-size: 12px; padding: 4px 8px; }
  .history-tools { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  .history-tools button { font-size: 12px; padding: 2px 9px; }
  .history-note { color: var(--danger); font-size: 12px; line-height: 1.5; margin-bottom: 6px; }
  .history-note:empty { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Eunoia</h1>
    <button id="history-toggle" type="button">对话</button>
    <button id="memory-toggle" type="button">记忆</button>
    <button id="new-conversation" type="button">新对话</button>
  </header>

  <main id="transcript" class="empty" aria-live="polite"></main>

  <footer>
    <form class="composer" id="composer">
      <label class="sr" for="input">说点什么</label>
      <textarea id="input" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
      <button class="primary" id="send" type="submit">发送</button>
    </form>
  </footer>
</div>

<div class="drawer" id="drawer" data-open="false">
  <div class="drawer-panel" role="dialog" aria-label="记忆">
    <header>
      <h1>记忆</h1>
      <button id="drawer-close" type="button">关闭</button>
    </header>
    <div class="drawer-body">
      <div class="row">
        <div>
          <div>让 ta 参考记忆</div>
          <div class="sub" style="color:var(--muted);font-size:12px">关掉之后，新的对话不会读取任何记忆。已经存下的不会删除。</div>
        </div>
        <button id="memory-enable" type="button" aria-pressed="true">开</button>
      </div>
      <div id="memory-list"></div>

      <!--
        Separated from the list above on purpose. Every other control in this
        panel is scoped to one memory and is undone by saying the thing again;
        this one is not undoable by any means, so it sits on its own below a
        rule and asks twice.
      -->
      <div class="danger-zone">
        <button id="forget-all" type="button">删除全部数据</button>
        <div class="sub">
          删掉 ta 记住的一切、所有对话和设置。无法撤销。
        </div>
      </div>
    </div>
  </div>
</div>

<div class="drawer" id="history" data-open="false">
  <div class="drawer-panel" role="dialog" aria-label="对话">
    <header>
      <h1>对话</h1>
      <button id="history-close" type="button">关闭</button>
    </header>
    <div class="drawer-body">
      <div class="history-tools">
        <button id="history-archived" type="button" aria-pressed="false">显示已归档</button>
      </div>
      <div id="history-note" class="history-note"></div>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const transcript = $('transcript');
const input = $('input');
const sendButton = $('send');

const state = {
  conversationId: null,
  sending: false,
  memoryEnabled: true,
  showArchived: false,
  feedback: new Map(),
};

// ---------------------------------------------------------------- render ----

/** Everything user- or model-authored goes in via textContent, never HTML. */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/** The three dots for the gap before any content at all has arrived. */
function dots() {
  const box = el('div', 'dots');
  box.append(el('span'), el('span'), el('span'));
  return box;
}

function addTurn(role, text = '') {
  transcript.classList.remove('empty');
  const turn = el('div', `turn ${role}`);
  const bubble = el('div', 'bubble');
  const body = el('div', 'text', text);
  bubble.append(body);
  turn.append(bubble);

  const meta = el('div', 'meta');
  const note = el('span');
  const actions = el('span');
  meta.append(note, actions);
  turn.append(meta);

  transcript.append(turn);
  scrollToEnd();
  return { turn, bubble, text: body, note, actions };
}

/**
 * The reasoning block.
 *
 * The model thinks for several seconds before its first visible character, and
 * without this the person watches a motionless `…` and cannot tell a slow reply
 * from a stalled one. It is shown as a margin note rather than as part of the
 * reply — its own muted tone, and closed the moment the answer begins — so the
 * answer stays the thing being read. See ADR 010.
 *
 * Built from DOM nodes rather than markup because the text inside is model
 * output, and the chevron is drawn from a border so no icon markup is needed.
 */
function addThinking(bubble) {
  const box = el('div', 'thinking');
  box.dataset.open = 'true';
  box.dataset.state = 'live';

  const label = el('span', 'label', '正在想…');
  const head = el('button', 'thinking-head');
  head.type = 'button';
  head.setAttribute('aria-expanded', 'true');
  head.append(el('span', 'dot'), label, el('span', 'chev'));

  const stream = el('span');
  const body = el('div', 'thinking-body');
  body.append(stream);

  box.append(head, body);
  bubble.prepend(box);

  let open = true;
  // Once the person opens or closes it themselves, stop deciding for them.
  let touched = false;
  let tailing = true;
  let closed = false;

  const setOpen = (next) => {
    open = next;
    box.dataset.open = String(next);
    head.setAttribute('aria-expanded', String(next));
  };
  head.onclick = () => {
    touched = true;
    setOpen(!open);
  };

  // Follow the tail while it streams, but do not fight someone who has
  // scrolled up to read what was already said.
  body.addEventListener('scroll', () => {
    tailing = body.scrollHeight - body.scrollTop - body.clientHeight < 24;
  });

  return {
    append(text) {
      stream.textContent += text;
      if (tailing) body.scrollTop = body.scrollHeight;
    },
    /** Idempotent: the first close wins, whichever path reached it. */
    close(summary) {
      if (closed) return;
      closed = true;
      box.dataset.state = 'done';
      label.textContent = summary;
      if (!touched) setOpen(false);
    },
    finish(elapsedMs) {
      // Round up: "思考了 0 秒" reads as a bug even when it is accurate.
      this.close(`思考了 ${Math.max(1, Math.round(elapsedMs / 1000))} 秒`);
    },
    abort() {
      this.close('思考过程');
    },
  };
}

function scrollToEnd() {
  transcript.scrollTop = transcript.scrollHeight;
}

function notice(text) {
  const box = el('div', 'notice', text);
  transcript.append(box);
  scrollToEnd();
}

// ------------------------------------------------------------ transport ----

/**
 * Parse an SSE byte stream by hand.
 *
 * `EventSource` cannot be used: it only issues GET, and the chat endpoint is
 * POST — putting a person's message in a URL would leak it into access logs and
 * browser history. Reading the body as a stream is also exactly what the
 * mini-program client has to do, so this logic transfers rather than being
 * thrown away.
 */
async function* readFrames(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let boundary = buffer.indexOf('\n\n');
    while (boundary >= 0) {
      const frame = buffer.slice(0, boundary);
      buffer = buffer.slice(boundary + 2);
      const line = frame.split('\n').find((l) => l.startsWith('data: '));
      if (line) {
        try {
          yield JSON.parse(line.slice(6));
        } catch {
          // A malformed frame is dropped rather than killing the stream; the
          // next one is probably fine.
        }
      }
      boundary = buffer.indexOf('\n\n');
    }
  }
}

async function send(text) {
  if (state.sending) return;
  state.sending = true;
  sendButton.disabled = true;
  input.value = '';
  resize();

  addTurn('user', text);
  const { bubble, text: body, note, actions } = addTurn('assistant');
  const waiting = dots();
  body.append(waiting);
  body.dataset.streaming = 'true';

  let thinking = null;
  let reply = '';
  let messageId = null;
  let risk = 'none';
  let toolNote = '';

  /** Drop the placeholder the moment there is anything real to show. */
  const settled = () => {
    if (waiting.isConnected) waiting.remove();
  };

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversationId: state.conversationId }),
    });

    if (!response.ok || !response.body) {
      const detail = await response.json().catch(() => ({}));
      throw new Error(detail.error || `HTTP ${response.status}`);
    }

    for await (const event of readFrames(response)) {
      if (event.type === 'thinking_delta') {
        settled();
        // Created on the first delta, so a turn the model answers without
        // thinking never grows an empty block.
        thinking ??= addThinking(bubble);
        thinking.append(event.text);
      } else if (event.type === 'thinking_done') {
        thinking?.finish(event.elapsedMs);
      } else if (event.type === 'text_delta') {
        settled();
        // The server always closes the block before the first reply delta, so
        // this only fires if that ever stops being true.
        thinking?.abort();
        reply += event.text;
        body.textContent = reply;
        scrollToEnd();
      } else if (event.type === 'memory_retrieved') {
        note.textContent = event.count > 0 ? `参考了 ${event.count} 条记忆` : '';
      } else if (event.type === 'safety_notice') {
        risk = event.level;
        if (event.replaced) notice('这一轮触发了安全回应。如果你现在很危险，请打 120 或 110。');
      } else if (event.type === 'completed') {
        reply = event.text;
        body.textContent = reply;
        // Only when the server names one: a turn that was not persisted reports
        // null, and taking that at face value would forget a conversation that
        // is still perfectly good.
        if (event.conversationId) rememberConversation(event.conversationId);
        messageId = event.messageId ?? null;
      } else if (event.type === 'error') {
        throw new Error(event.message);
      } else if (event.type === 'tool_call') {
        note.textContent = '（回想中…）';
        toolNote = '（回想中…）';
      }
    }

    // A tool note is transient: it described the moment, not the turn.
    if (note.textContent === toolNote) note.textContent = '';
    if (messageId) addFeedback(actions, messageId);
  } catch (error) {
    // A half-shown thought with no ending is worse than none; close it.
    thinking?.abort();
    settled();
    body.textContent = '';
    body.append(el('span', null, `出错了：${error.message}`));
    body.style.color = 'var(--danger)';
  } finally {
    // Whether it finished, failed, or was cut off, nothing is arriving now.
    delete body.dataset.streaming;
    state.sending = false;
    sendButton.disabled = false;
    scrollToEnd();
  }
}

function addFeedback(actions, messageId) {
  actions.textContent = '';
  const up = el('button', null, '有帮助');
  const down = el('button', null, '不太对');
  up.type = 'button';
  down.type = 'button';

  const rate = async (rating) => {
    state.feedback.set(messageId, rating);
    up.setAttribute('aria-pressed', String(rating === 'good'));
    down.setAttribute('aria-pressed', String(rating === 'bad'));
    await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messageId, rating }),
    }).catch(() => undefined);
  };

  up.onclick = () => void rate('good');
  down.onclick = () => void rate('bad');
  actions.append(up, down);
}

// --------------------------------------------------------- conversations ----

/**
 * The conversation id survives a reload.
 *
 * `localStorage` rather than the URL, because a URL is a thing people paste and
 * a conversation is private. Both directions are wrapped: storage throws in some
 * privacy modes, and failing to remember which conversation this is costs less
 * than a page that will not start.
 */
const STORAGE_KEY = 'df_conversation';

function rememberConversation(id) {
  state.conversationId = id;
  try {
    if (id) localStorage.setItem(STORAGE_KEY, id);
    else localStorage.removeItem(STORAGE_KEY);
  } catch {
    // The conversation still works for this page view; only the reload is lost.
  }
}

function recallConversation() {
  try {
    return localStorage.getItem(STORAGE_KEY);
  } catch {
    return null;
  }
}

/** "刚刚" / "12 分钟前" / "3 小时前" / "9 月 28 日" */
function whenLabel(iso) {
  const then = new Date(iso);
  if (Number.isNaN(then.getTime())) return '';
  const minutes = Math.round((Date.now() - then.getTime()) / 60000);
  if (minutes < 1) return '刚刚';
  if (minutes < 60) return `${minutes} 分钟前`;
  if (minutes < 60 * 24) return `${Math.round(minutes / 60)} 小时前`;
  return `${then.getMonth() + 1} 月 ${then.getDate()} 日`;
}

/**
 * Render a stored conversation.
 *
 * No streaming and no reasoning block: those described a turn while it was
 * happening, and replaying them would be a re-enactment rather than a record.
 * What is drawn is what was said.
 */
async function loadConversation(id) {
  const response = await fetch(`/api/conversations/${id}/messages`).catch(() => null);
  if (!response || !response.ok) return false;

  // `?? []` rather than trusting the shape: a proxy or a future server that
  // answers 200 with something else should leave the page usable, not throw
  // inside a click handler where nothing is listening for it.
  const { messages = [] } = await response.json();
  if (messages.length === 0) return false;

  transcript.textContent = '';
  transcript.classList.remove('empty');
  for (const message of messages) {
    const { actions } = addTurn(message.role, message.content);
    if (message.role === 'assistant') addFeedback(actions, message.id);
  }
  rememberConversation(id);
  scrollToEnd();
  return true;
}

function setHistoryNote(text) {
  $('history-note').textContent = text;
}

/** Clear the transcript and forget which conversation it was. */
function clearConversationView() {
  rememberConversation(null);
  transcript.textContent = '';
  transcript.classList.add('empty');
  input.focus();
}

async function refreshHistory() {
  const list = $('history-list');
  list.textContent = '';
  setHistoryNote('');

  // Archived rows are a separate view, not a second list. The server keeps them
  // out of the ordinary response, so the toggle has to ask for them explicitly.
  const response = await fetch(
    state.showArchived ? '/api/conversations?includeArchived=1' : '/api/conversations',
  ).catch(() => null);
  if (!response || !response.ok) {
    list.append(el('div', 'empty-note', '读不到历史对话。'));
    return;
  }

  const { conversations = [] } = await response.json();
  if (conversations.length === 0) {
    list.append(el('div', 'empty-note', '还没有别的对话。'));
    return;
  }

  for (const conversation of conversations) {
    const archived = Boolean(conversation.archivedAt);
    const row = el('div', 'thread-row');

    const open = el('button', 'thread');
    open.type = 'button';
    const named = Boolean(conversation.title);
    open.append(
      el('span', `name${named ? '' : ' unnamed'}`, conversation.title ?? '（没有名字的对话）'),
    );
    const when = whenLabel(conversation.lastTurnAt ?? conversation.startedAt);
    open.append(el('span', 'when', archived ? `${when} · 已归档` : when));
    open.setAttribute('aria-current', String(conversation.id === state.conversationId));
    open.onclick = async () => {
      // Already open: just close the drawer rather than re-fetching what is
      // already on screen.
      if (conversation.id !== state.conversationId) await loadConversation(conversation.id);
      $('history').dataset.open = 'false';
    };

    // A conversation has a lifecycle, so the row does too: rename and archive
    // are reversible; delete asks twice because it is not.
    const actions = el('div', 'thread-actions');
    const rename = el('button', null, '改名');
    rename.type = 'button';
    rename.onclick = () => beginRename(row, conversation);

    const archive = el('button', null, archived ? '恢复' : '归档');
    archive.type = 'button';
    archive.onclick = () => void setArchived(conversation, !archived);

    const remove = el('button', 'thread-delete', '删除');
    remove.type = 'button';
    remove.onclick = () => void deleteThread(conversation, remove);

    actions.append(rename, archive, remove);
    row.append(open, actions);
    list.append(row);
  }
}

function beginRename(row, conversation) {
  setHistoryNote('');
  row.textContent = '';

  const editor = el('div', 'thread-rename');
  const field = el('input');
  field.value = conversation.title ?? '';
  field.setAttribute('maxlength', '80');
  field.setAttribute('aria-label', '对话名称');

  const save = el('button', 'primary', '保存');
  save.type = 'button';
  const cancel = el('button', null, '取消');
  cancel.type = 'button';

  const commit = async () => {
    save.disabled = true;
    const response = await fetch(`/api/conversations/${conversation.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: field.value }),
    }).catch(() => null);
    save.disabled = false;

    if (!response || !response.ok) {
      setHistoryNote('改名失败，稍后再试。');
      field.focus();
      return;
    }
    await refreshHistory();
  };

  save.onclick = () => void commit();
  cancel.onclick = () => void refreshHistory();
  field.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      void commit();
    } else if (event.key === 'Escape') {
      void refreshHistory();
    }
  });

  editor.append(field, save, cancel);
  row.append(editor);
  field.focus();
}

async function setArchived(conversation, archived) {
  setHistoryNote('');
  const response = await fetch(`/api/conversations/${conversation.id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ archived }),
  }).catch(() => null);

  if (!response || !response.ok) {
    setHistoryNote(archived ? '归档失败，稍后再试。' : '恢复失败，稍后再试。');
    return;
  }

  // Archiving the conversation that is on screen would leave an open thread
  // with no row in the list. Start clean instead of hiding it underneath.
  if (archived && state.conversationId === conversation.id) clearConversationView();
  await refreshHistory();
}

async function deleteThread(conversation, button) {
  if (button.dataset.armed !== 'true') {
    button.dataset.armed = 'true';
    button.textContent = '确认删除';
    setTimeout(() => {
      if (!button.isConnected) return;
      button.dataset.armed = 'false';
      button.textContent = '删除';
    }, 4000);
    return;
  }

  setHistoryNote('');
  button.disabled = true;
  button.textContent = '删除中…';
  const response = await fetch(`/api/conversations/${conversation.id}`, {
    method: 'DELETE',
  }).catch(() => null);

  if (!response || !response.ok) {
    setHistoryNote('删除失败，稍后再试。');
    button.disabled = false;
    button.dataset.armed = 'false';
    button.textContent = '删除';
    return;
  }

  if (state.conversationId === conversation.id) clearConversationView();
  await refreshHistory();
}

// -------------------------------------------------------------- memory ------

async function openDrawer() {
  $('drawer').dataset.open = 'true';
  await refreshMemory();
}

async function refreshMemory() {
  const list = $('memory-list');
  list.textContent = '';

  const response = await fetch('/api/memory').catch(() => null);
  if (!response || !response.ok) {
    list.append(el('div', 'empty-note', '读不到记忆。'));
    return;
  }

  const { memories, enabled } = await response.json();
  state.memoryEnabled = enabled;
  $('memory-enable').textContent = enabled ? '开' : '关';
  $('memory-enable').setAttribute('aria-pressed', String(enabled));

  const active = memories.filter((m) => m.status !== 'deleted');
  if (active.length === 0) {
    list.append(el('div', 'empty-note', '还没有记住什么。'));
    return;
  }

  const sourceLabels = {
    user_explicit: '你让我记住的',
    user_stated: '你说过的',
    inferred: '我的推测',
  };
  const typeLabels = { episodic: '一件事', semantic: '关于你', narrative: '你正在经历的' };

  for (const memory of active) {
    const item = el('div', 'memory');
    item.append(el('p', null, memory.content));

    const tags = el('div', 'tags');
    const label = el('span', 'tag' + (memory.status === 'unconfirmed' ? ' unconfirmed' : ''),
      `${sourceLabels[memory.source] ?? memory.source} · ${typeLabels[memory.type] ?? memory.type}` +
      (memory.status === 'unconfirmed' ? ' · 待确认' : ''));
    tags.append(label);

    if (memory.accessCount > 0) tags.append(el('span', null, `被想起 ${memory.accessCount} 次`));

    const remove = el('button', null, '删除');
    remove.type = 'button';
    remove.onclick = async () => {
      await fetch(`/api/memory/${memory.id}`, { method: 'DELETE' }).catch(() => undefined);
      await refreshMemory();
    };
    tags.append(remove);

    item.append(tags);
    list.append(item);
  }
}

// ------------------------------------------------------- forgetting all -----

/**
 * Delete everything (spec §44, `deletion`).
 *
 * Two clicks rather than a `confirm()` dialog, for the same reason the rest of
 * this panel avoids modals: a browser dialog is a thing people dismiss on
 * reflex, and the reflex is trained by dialogs that do not matter. Arming the
 * button changes what it says and what it looks like, so the second click is
 * made deliberately.
 *
 * The armed state expires, because a button left armed while the drawer sits
 * open is a button that eventually gets clicked by someone who has forgotten
 * why it is red.
 */
const FORGET_ARM_MS = 5000;
let forgetTimer = null;

async function forgetEverything() {
  const button = $('forget-all');
  const armed = button.dataset.armed === 'true';

  if (!armed) {
    button.dataset.armed = 'true';
    button.textContent = '再点一次，删除';
    clearTimeout(forgetTimer);
    forgetTimer = setTimeout(disarmForget, FORGET_ARM_MS);
    return;
  }

  clearTimeout(forgetTimer);
  button.disabled = true;
  button.textContent = '正在删除…';

  const response = await fetch('/api/me', { method: 'DELETE' }).catch(() => null);
  button.disabled = false;

  if (!response || !response.ok) {
    // Left armed would be a trap: the next click would delete after a failure
    // the person was never told about.
    disarmForget();
    button.textContent = '删除失败，稍后再试';
    return;
  }

  // The client's half of the deletion. The cookie is gone, so the conversation
  // id in `localStorage` now points at nothing, and a transcript left on screen
  // would be the only remaining copy of what was just deleted.
  rememberConversation(null);
  transcript.textContent = '';
  transcript.classList.add('empty');
  $('history-list').textContent = '';
  disarmForget();
  button.textContent = '都删掉了';
  // The transcript's empty state is a stylesheet rule, not an element, so the
  // confirmation goes where the click was rather than over the top of it.
  setTimeout(() => { if (!button.disabled) button.textContent = '删除全部数据'; }, 2500);
}

function disarmForget() {
  const button = $('forget-all');
  button.dataset.armed = 'false';
  button.textContent = '删除全部数据';
}

// --------------------------------------------------------------- events -----

function resize() {
  input.style.height = 'auto';
  input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
}

input.addEventListener('input', resize);
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    $('composer').requestSubmit();
  }
});

$('composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (text.length > 0) void send(text);
});

$('new-conversation').onclick = () => {
  // Forget the id as well as clearing the screen: otherwise the next reload
  // would pull the old conversation back and the "new" one would have been a
  // view change rather than a new conversation.
  clearConversationView();
};

$('memory-toggle').onclick = () => void openDrawer();
$('forget-all').onclick = () => void forgetEverything();
// Closing the drawer disarms: an armed button that survives being put away is
// an armed button someone finds later without the context that made it red.
$('drawer-close').onclick = () => {
  $('drawer').dataset.open = 'false';
  disarmForget();
};
$('drawer').addEventListener('click', (event) => {
  if (event.target === $('drawer')) {
    $('drawer').dataset.open = 'false';
    disarmForget();
  }
});

$('history-toggle').onclick = () => {
  $('history').dataset.open = 'true';
  void refreshHistory();
};
$('history-close').onclick = () => { $('history').dataset.open = 'false'; };
$('history-archived').onclick = () => {
  state.showArchived = !state.showArchived;
  $('history-archived').setAttribute('aria-pressed', String(state.showArchived));
  $('history-archived').textContent = state.showArchived ? '隐藏已归档' : '显示已归档';
  void refreshHistory();
};
$('history').addEventListener('click', (event) => {
  if (event.target === $('history')) $('history').dataset.open = 'false';
});

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  for (const id of ['drawer', 'history']) {
    if ($(id).dataset.open === 'true') $(id).dataset.open = 'false';
  }
});

$('memory-enable').onclick = async () => {
  state.memoryEnabled = !state.memoryEnabled;
  await fetch('/api/preferences', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ 'memory.enabled': state.memoryEnabled }),
  }).catch(() => undefined);
  await refreshMemory();
};

/**
 * The last conversation comes back on reload.
 *
 * This is the whole point of storing the id: a companion you have to re-introduce
 * yourself to every time you open the page is not keeping anything. Failures are
 * silent — the stored id is kept rather than cleared, because a request that
 * failed once says nothing about whether the conversation still exists, and the
 * server treats an id that is not this user's as "start a new one" anyway.
 */
async function restore() {
  const saved = recallConversation();
  if (!saved) return;
  // Adopted before the fetch, not after: if reading the messages fails, the next
  // message still continues that conversation instead of quietly starting a new
  // one and leaving the thread behind.
  state.conversationId = saved;
  await loadConversation(saved);
}

resize();
input.focus();
void restore();
</script>
