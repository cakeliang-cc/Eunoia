<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>陪伴</title>
    <style>
      :root {
        --bg: #faf8f5;
        --fg: #2f2b28;
        --muted: #8a8177;
        --accent: #7a6a5d;
        --user-bg: #ece7e0;
        --line: #e3ddd4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1a18;
          --fg: #e8e3dc;
          --muted: #948b80;
          --accent: #b3a496;
          --user-bg: #2b2724;
          --line: #34302b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        padding: 20px 24px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        color: var(--muted);
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
      .turn { display: flex; flex-direction: column; gap: 6px; }
      .who { font-size: 12px; color: var(--muted); }
      .bubble { white-space: pre-wrap; word-break: break-word; }
      .user .bubble {
        background: var(--user-bg);
        padding: 10px 14px;
        border-radius: 14px;
        align-self: flex-start;
        max-width: 85%;
      }
      .agent .bubble { padding: 2px 2px; }
      .agent.streaming .bubble::after {
        content: "▍";
        color: var(--accent);
        animation: blink 1.1s steps(2, start) infinite;
      }
      @keyframes blink { to { visibility: hidden; } }
      .error .bubble { color: #b4553f; }
      form {
        border-top: 1px solid var(--line);
        padding: 16px 24px 24px;
        display: flex;
        gap: 10px;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
      textarea {
        flex: 1;
        resize: none;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        color: inherit;
        font: inherit;
        max-height: 160px;
      }
      textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      button {
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
    </style>
  </head>
  <body>
    <header>一个会记得你的对话</header>
    <div id="log" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="说点什么…" autofocus></textarea>
      <button id="send" type="submit">发送</button>
    </form>

    <script type="module">
      const log = document.getElementById('log');
      const form = document.getElementById('composer');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      /** Append a turn and return its bubble element. */
      function addTurn(role, text = '') {
        const turn = document.createElement('div');
        turn.className = `turn ${role}`;
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = role === 'user' ? '你' : '陪伴';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        turn.append(who, bubble);
        log.append(turn);
        log.scrollTop = log.scrollHeight;
        return bubble;
      }

      /**
       * Parse SSE frames out of a byte stream.
       *
       * The endpoint is POST, so `EventSource` is not usable — it only issues
       * GET, and putting a message in a URL would leak it into access logs and
       * browser history. Reading the body and parsing frames by hand is also
       * exactly what the mini-program client will do, so the logic transfers.
       */
      async function* readFrames(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // Frames are separated by a blank line; a partial tail stays buffered.
          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const raw = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            const dataLine = raw
              .split('\n')
              .find((line) => line.startsWith('data: '));
            if (!dataLine) continue; // heartbeat comment
            try {
              yield JSON.parse(dataLine.slice(6));
            } catch {
              /* ignore a malformed frame rather than killing the stream */
            }
          }
        }
      }

      async function sendMessage(message) {
        addTurn('user', message);
        const bubble = addTurn('agent');
        const turn = bubble.parentElement;
        turn.classList.add('streaming');

        send.disabled = true;
        input.disabled = true;

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message }),
          });

          if (!response.ok) {
            const detail = await response.json().catch(() => ({}));
            throw new Error(detail.error ?? `HTTP ${response.status}`);
          }

          let text = '';
          for await (const event of readFrames(response)) {
            if (event.type === 'text_delta') {
              text += event.text;
              bubble.textContent = text;
              log.scrollTop = log.scrollHeight;
            } else if (event.type === 'completed') {
              // The completed event is authoritative; deltas are for the effect.
              bubble.textContent = event.text || text;
            } else if (event.type === 'error') {
              throw new Error(event.message);
            }
          }
        } catch (error) {
          turn.classList.add('error');
          bubble.textContent =
            error instanceof Error ? `出错了：${error.message}` : '出错了。';
        } finally {
          turn.classList.remove('streaming');
          send.disabled = false;
          input.disabled = false;
          input.focus();
        }
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = '';
        input.style.height = 'auto';
        void sendMessage(message);
      });

      // Enter sends; Shift+Enter makes a newline.
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      // Grow the textarea with its content.
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
      });
    </script>
  </body>
</html>
